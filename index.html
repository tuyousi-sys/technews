<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Tech News Dash</title>
<style>
:root {
  --bg:#0f172a; --card:#1e293b; --card2:#172033; --text:#f8fafc; --muted:#cbd5e1; --sub:#94a3b8;
  --line:#334155; --accent:#3b82f6;
  --ai:#a855f7; --pc:#3b82f6; --mobile:#10b981; --security:#f43f5e; --business:#14b8a6; --other:#64748b;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Meiryo",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
button { font:inherit; cursor:pointer; }
button:disabled { opacity:.55; cursor:not-allowed; }

/* ヘッダー */
header { position:sticky; top:0; z-index:20; background:rgba(15,23,42,.96); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
.header-row { max-width:1500px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.brand { min-width:0; }
.title { color:var(--accent); font-size:1.35rem; font-weight:900; letter-spacing:.02em; }
.status { color:var(--sub); font-size:.82rem; margin-top:3px; }
.tabs { display:flex; background:#1e293b; border:1px solid var(--line); border-radius:999px; padding:3px; margin-left:auto; }
.tab { background:none; border:0; color:var(--muted); padding:8px 16px; border-radius:999px; font-size:.9rem; font-weight:800; }
.tab b { font-weight:900; margin-left:4px; }
.tab.active { background:var(--accent); color:#fff; }
#updateBtn { background:var(--accent); color:#fff; border:0; border-radius:999px; padding:11px 22px; font-size:.95rem; font-weight:900; }
#updateBtn:hover:not(:disabled) { background:#2563eb; }
.progress { height:3px; background:transparent; }
.progress div { height:100%; width:0; background:var(--accent); transition:width .25s; }

/* ジャンルと検索 */
main { max-width:1500px; margin:0 auto; padding:16px; }
.toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { background:#1e293b; border:1px solid var(--line); color:#e2e8f0; border-radius:999px; padding:7px 12px; font-size:.82rem; font-weight:700; display:inline-flex; align-items:center; }
.chip:hover { border-color:#64748b; }
.chip.on { background:#e2e8f0; color:#0f172a; border-color:#e2e8f0; }
.chip.zero { opacity:.45; }
.chip i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
.chip em { font-style:normal; margin-left:6px; opacity:.75; font-weight:900; }
.search-box { min-width:240px; max-width:420px; flex:1; }
.search-box input { width:100%; background:#fff; color:#0f172a; border:1px solid #cbd5e1; border-radius:999px; padding:10px 14px; font-size:.9rem; outline:none; }
.search-box input:focus { border-color:var(--accent); }
.warn { display:none; background:#422006; border:1px solid #a16207; color:#fde68a; border-radius:12px; padding:9px 13px; font-size:.82rem; margin-bottom:12px; line-height:1.6; }
.warn.show { display:block; }

/* 記事カード */
#newsList { display:grid; grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); gap:16px; }
.card { --genre:var(--other); position:relative; background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--line); border-top:8px solid var(--genre); border-radius:18px; padding:18px; box-shadow:0 4px 14px rgba(0,0,0,.28); transition:transform .16s,border-color .16s,opacity .2s; }
.card:hover { transform:translateY(-2px); border-color:var(--genre); }
.card.done { opacity:.5; }
.card .source { color:var(--genre); font-size:.8rem; font-weight:900; margin-bottom:9px; }
.card h2 { font-size:1.15rem; line-height:1.45; margin-bottom:9px; }
.card h2 a { color:var(--text); text-decoration:none; }
.card h2 a::after { content:""; position:absolute; inset:0; border-radius:18px; }
.card p { color:var(--muted); font-size:.85rem; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-footer { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:13px; color:var(--sub); font-size:.8rem; }
.card-buttons { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; position:relative; z-index:2; }
.btn { border-radius:999px; padding:10px 15px; font-size:.88rem; font-weight:900; border:1px solid; }
.btn.read { background:#334155; color:#e2e8f0; border-color:#475569; }
.btn.restore { background:#064e3b; color:#fff; border-color:#047857; }
.btn.open { background:#1d4ed8; color:#fff; border-color:#2563eb; }
.ai { --genre:var(--ai); } .pc { --genre:var(--pc); } .mobile { --genre:var(--mobile); }
.security { --genre:var(--security); } .business { --genre:var(--business); } .other { --genre:var(--other); }
.msg { grid-column:1/-1; text-align:center; color:var(--sub); background:#1e293b; border:1px solid var(--line); border-radius:18px; padding:50px 20px; line-height:1.9; }

/* 整理(危険な操作はここにまとめる) */
.tools { margin-top:22px; border-top:1px solid var(--line); padding-top:14px; color:var(--sub); font-size:.82rem; }
.tools summary { cursor:pointer; font-weight:800; }
.tools-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
.tools button { background:#1e293b; color:#e2e8f0; border:1px solid var(--line); border-radius:999px; padding:9px 14px; font-size:.82rem; font-weight:800; }
.tools button.danger { background:#7f1d1d; border-color:#991b1b; color:#fff; }
.tools p { margin-top:10px; line-height:1.7; }

@media(max-width:720px) {
  .header-row { padding:10px 12px; gap:10px; }
  .tabs { margin-left:0; order:3; width:100%; }
  .tab { flex:1; padding:9px 8px; }
  #updateBtn { margin-left:auto; padding:10px 18px; }
  main { padding:12px; }
  #newsList { grid-template-columns:1fr; }
  .card { padding:15px; }
  .card h2 { font-size:1.06rem; }
  .toolbar { display:block; }
  .chips { flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; }
  .chip { flex:none; }
  .search-box { margin-top:10px; max-width:none; }
}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="brand">
      <div class="title">Tech News Dash</div>
      <div id="status" class="status">読み込み中…</div>
    </div>
    <div class="tabs" role="tablist">
      <button id="unreadBtn" class="tab active" type="button" role="tab">未読<b id="unreadN">0</b></button>
      <button id="readBtn" class="tab" type="button" role="tab">既読<b id="readN">0</b></button>
    </div>
    <button id="updateBtn" type="button">更新</button>
  </div>
  <div class="progress"><div id="bar"></div></div>
</header>

<main>
  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <div class="search-box"><input id="searchInput" type="search" placeholder="タイトル・説明・媒体名で検索" autocomplete="off"></div>
  </div>
  <div id="warn" class="warn"></div>
  <section id="newsList"></section>

  <details class="tools">
    <summary>整理(既読のリセット・削除)</summary>
    <div class="tools-row">
      <button id="resetBtn" type="button">既読をすべて未読に戻す</button>
      <button id="purgeBtn" type="button" class="danger">既読の記事を削除</button>
    </div>
    <p>「未読に戻す」は、記事を残したまま、既読の印だけを外します。<br>「既読の記事を削除」は、既読の記事を一覧から消します(新しい記事を更新で取り込むと、消した記事は、まだ配信されていれば、また未読で出ます)。<br>記事は最大100件まで保存され、新しい順に並びます。「更新」で、各媒体のRSSから新着を取得します。</p>
  </details>
</main>

<script>
/* ===== 設定 ===== */
const HISTORY_KEY = "tech_news_dash_read_v2";      // 既読の印(以前の版と共通)
const ARTICLE_KEY = "tech_news_dash_articles_v2";  // 保存した記事(以前の版と共通)
const LAST_KEY    = "tech_news_dash_last_v2";      // 最終更新の時刻
const PROXY_KEY   = "tech_news_dash_proxy_v2";     // 最後に成功した中継先
const MAX_ARTICLES = 100;
const MAX_READ_MARKS = 2000;
const AUTO_UPDATE_MIN = 10;   // 開いたとき、前回の更新からこの分数が過ぎていたら自動で更新
const CONCURRENCY = 5;        // 同時に取得する媒体の数
const TIMEOUT_MS = 8000;

const FEEDS = {
  "ITmedia NEWS":   "https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml",
  "GIGAZINE":       "https://gigazine.net/news/rss_2.0/",
  "Gizmodo JP":     "https://www.gizmodo.jp/index.xml",
  "PC Watch":       "https://pc.watch.impress.co.jp/data/rss/1.0/pcw/feed.rdf",
  "ASCII.jp":       "https://ascii.jp/rss.xml",
  "ZDNet Japan":    "https://japan.zdnet.com/rss/index.rdf",
  "マイナビ TECH+": "https://news.mynavi.jp/rss/techplus/technology",
  "ケータイ Watch": "https://k-tai.watch.impress.co.jp/data/rss/1.0/ktw/feed.rdf",
  "窓の杜":         "https://forest.watch.impress.co.jp/data/rss/1.0/wf/feed.rdf",
  "AV Watch":       "https://av.watch.impress.co.jp/data/rss/1.0/avw/feed.rdf"
};

const PROXIES = [
  u => ({ url: `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`, json: true }),
  u => ({ url: `https://corsproxy.io/?${encodeURIComponent(u)}`, json: false }),
  u => ({ url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`, json: false }),
  u => ({ url: `https://thingproxy.freeboard.io/fetch/${u}`, json: false }),
  u => ({ url: `https://yacdn.org/proxy/${u}`, json: false })
];

const GENRES = [
  { key:"ai",       name:"AI",           color:"var(--ai)" },
  { key:"pc",       name:"PC・パーツ",   color:"var(--pc)" },
  { key:"mobile",   name:"スマホ",       color:"var(--mobile)" },
  { key:"security", name:"セキュリティ", color:"var(--security)" },
  { key:"business", name:"ビジネス",     color:"var(--business)" },
  { key:"other",    name:"その他",       color:"var(--other)" }
];
const GENRE_NAME = Object.fromEntries(GENRES.map(g => [g.key, g.name]));

/* ===== 状態 ===== */
const $ = id => document.getElementById(id);
let allArticles = [];
let readSet = new Set();
let mode = "unread";        // unread | read
let genreFilter = "all";
let updating = false;
let failedFeeds = [];

/* ===== 保存 ===== */
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(ARTICLE_KEY) || "[]");
    if (Array.isArray(saved)) {
      allArticles = saved.filter(a => a && a.link && !/example\.com/.test(a.link)).map(normalize);
    }
  } catch (e) {}
  try { readSet = new Set(JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]")); } catch (e) {}
}
function normalize(a) {
  const ts = Number(a.ts) || Date.parse(a.date) || 0;
  const key = classifyGenre(a.title || "", a.description || "", a.source || "");
  return { ...a, ts, genreClass: key, genreName: GENRE_NAME[key] };
}
function saveArticles() {
  const seen = new Map();
  allArticles.forEach(a => { if (a.link && !seen.has(a.link)) seen.set(a.link, a); });
  allArticles = [...seen.values()].sort((a, b) => b.ts - a.ts).slice(0, MAX_ARTICLES);
  try { localStorage.setItem(ARTICLE_KEY, JSON.stringify(allArticles)); } catch (e) {}
}
function saveRead() {
  let arr = [...readSet];
  if (arr.length > MAX_READ_MARKS) { arr = arr.slice(-MAX_READ_MARKS); readSet = new Set(arr); }
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); } catch (e) {}
}

/* ===== ジャンル分類(英単語は単語の区切りで判定し、誤判定を減らしています) ===== */
const RULES = [
  ["security", /セキュリティ|脆弱性|不正アクセス|マルウェア|ランサム|情報漏えい|情報漏洩|攻撃|パスワード|パスキー|認証|\b(?:secure boot|patch|zero.?day|cve|vulnerabilit|malware|ransomware|breach|exploit|phishing|cybersecurity)/],
  ["mobile",   /スマホ|スマートフォン|モバイル|携帯|\b(?:iphone|android|galaxy|pixel|xperia|smartphone|mobile)|\b(?:ios|sim|esim|siri|5g)\b/],
  ["ai",       /生成ai|人工知能|画像生成|機械学習|\b(?:chatgpt|copilot|gemini|openai|deepmind|claude|gpt|agent|artificial intelligence|machine learning|neural)|\b(?:ai|llm|npu)\b/],
  ["pc",       /メモリ|自作|パソコン|ノートpc|\b(?:geforce|radeon|ryzen|intel|processor|hardware|graphics card|semiconductor|chip|rtx|windows|core i\d)|\b(?:gpu|cpu|pc|ssd|amd|macbook|macos|mac)\b/],
  ["business", /決算|株|投資|企業|買収|売上|市場|ビジネス|経済|物流|価格|料金|サブスク|\b(?:amazon|microsoft|apple|google|nvidia|acquisition|revenue|funding|startup|earnings)|\b(?:meta|ipo)\b/]
];
function classifyGenre(title, desc, source) {
  const t = `${title} ${desc} ${source}`.toLowerCase();
  for (const [key, re] of RULES) if (re.test(t)) return key;
  return "other";
}

/* ===== RSS取得 ===== */
function escapeHtml(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
let proxyOrder = PROXIES.map((_, i) => i);
try {
  const p = Number(localStorage.getItem(PROXY_KEY));
  if (p >= 0 && p < PROXIES.length) proxyOrder = [p, ...proxyOrder.filter(i => i !== p)];
} catch (e) {}
function rememberProxy(i) {
  proxyOrder = [i, ...proxyOrder.filter(x => x !== i)];
  try { localStorage.setItem(PROXY_KEY, String(i)); } catch (e) {}
}
function fetchWithTimeout(url, opts = {}) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), TIMEOUT_MS);
  return fetch(url, { ...opts, signal: c.signal }).finally(() => clearTimeout(t));
}
/* GitHubが自動で集めた news.json があれば、それを最優先で読む(中継サービスは使わない) */
async function loadFromServer() {
  try {
    const r = await fetchWithTimeout("news.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    return (j && Array.isArray(j.articles) && j.articles.length) ? j : null;
  } catch (e) { return null; }
}
async function tryFetch(url) {
  for (const idx of proxyOrder) {
    try {
      const { url: proxyUrl, json } = PROXIES[idx](url);
      const r = await fetchWithTimeout(proxyUrl);
      if (!r.ok) continue;
      const text = json ? ((await r.json()).contents ?? "") : await r.text();
      if (typeof text === "string" && text.length > 200 && text.includes("<")) { rememberProxy(idx); return text; }
    } catch (e) {}
  }
  return null;
}
function textOf(item, names) {
  for (const n of names) {
    const el = item.getElementsByTagName(n)[0];
    if (el && el.textContent.trim()) return el.textContent.trim();
  }
  return "";
}
function linkOf(item) {
  const el = item.getElementsByTagName("link")[0];
  return el ? (el.getAttribute("href") || el.textContent || "").trim() : "";
}
function decodeEntities(s) {
  const t = document.createElement("textarea");
  t.innerHTML = s;
  return t.value;
}
async function fetchFeed(source, url) {
  const raw = await tryFetch(url);
  if (!raw) return null;                        // 取得できなかった
  try {
    const xml = new DOMParser().parseFromString(raw, "text/xml");
    const items = [...xml.getElementsByTagName("item"), ...xml.getElementsByTagName("entry")].slice(0, 35);
    return items.map(item => {
      const title = decodeEntities(textOf(item, ["title"])) || "無題";
      const link = linkOf(item);
      const dateStr = textOf(item, ["pubDate", "published", "updated", "dc:date", "date"]);
      const desc = decodeEntities(
        textOf(item, ["description", "summary", "content:encoded", "content"]).replace(/<[^>]+>/g, " ")
      ).replace(/\s+/g, " ").trim().slice(0, 120);
      let ts = Date.parse(dateStr);
      if (isNaN(ts)) ts = Date.now();
      return normalize({ source, title, description: desc || "内容なし", link, ts, date: ymd(ts) });
    }).filter(a => a.link);
  } catch (e) { return null; }
}

/* ===== 更新 ===== */
async function runPool(entries, worker, limit) {
  let i = 0;
  const next = async () => { while (i < entries.length) await worker(entries[i++]); };
  await Promise.all(Array.from({ length: Math.min(limit, entries.length) }, next));
}
async function updateNews() {
  if (updating) return;
  updating = true;
  failedFeeds = [];
  const btn = $("updateBtn");
  btn.disabled = true;
  btn.textContent = "更新中…";
  const entries = Object.entries(FEEDS);
  let done = 0, got = 0;
  $("bar").style.width = "4%";
  $("status").textContent = `取得中 0 / ${entries.length} 媒体`;
  render();

  const server = await loadFromServer();
  if (server) {
    allArticles = allArticles.concat(server.articles.map(a => normalize({ ...a, date: ymd(a.ts) })));
    failedFeeds = Array.isArray(server.failed) ? server.failed : [];
    got = server.articles.length;
    done = entries.length;
    $("bar").style.width = "100%";
  } else await runPool(entries, async ([src, url]) => {
    const articles = await fetchFeed(src, url);
    done++;
    if (articles === null) failedFeeds.push(src);
    else { got += articles.length; allArticles = allArticles.concat(articles); }
    $("bar").style.width = `${Math.round(done / entries.length * 100)}%`;
    $("status").textContent = `取得中 ${done} / ${entries.length} 媒体(${got}件)`;
  }, CONCURRENCY);

  saveArticles();
  if (failedFeeds.length < entries.length) {
    try { localStorage.setItem(LAST_KEY, String(Date.now())); } catch (e) {}
  }
  updating = false;
  btn.disabled = false;
  btn.textContent = "更新";
  $("bar").style.width = "0";
  render();
}

/* ===== 表示 ===== */
function ymd(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function hm(d) { return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
function dayLabel(ts) {
  const d = new Date(ts), now = new Date();
  const dayDiff = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  const timeKnown = ts % 86400000 !== 0;   // 日付だけの古い保存データは時刻を出さない
  const base = dayDiff === 0 ? "今日" : dayDiff === 1 ? "昨日" : `${d.getMonth() + 1}/${d.getDate()}`;
  return timeKnown ? `${base} ${hm(d)}` : base;
}
function isRead(a) { return readSet.has(a.link); }

function render() {
  const query = $("searchInput").value.trim().toLowerCase();
  const wantRead = mode === "read";

  /* 件数 */
  let unread = 0, read = 0;
  const byGenre = {};
  allArticles.forEach(a => {
    isRead(a) ? read++ : unread++;
    if (isRead(a) === wantRead) byGenre[a.genreClass] = (byGenre[a.genreClass] || 0) + 1;
  });
  const inMode = wantRead ? read : unread;
  $("unreadN").textContent = unread;
  $("readN").textContent = read;
  $("unreadBtn").classList.toggle("active", !wantRead);
  $("readBtn").classList.toggle("active", wantRead);

  /* ジャンルのボタン(押すと絞り込み) */
  $("chips").innerHTML =
    `<button type="button" class="chip${genreFilter === "all" ? " on" : ""}" data-genre="all">すべて<em>${inMode}</em></button>` +
    GENRES.map(g => {
      const n = byGenre[g.key] || 0;
      return `<button type="button" class="chip${genreFilter === g.key ? " on" : ""}${n ? "" : " zero"}" data-genre="${g.key}"><i style="background:${g.color}"></i>${g.name}<em>${n}</em></button>`;
    }).join("");

  /* 状態表示 */
  if (!updating) {
    const last = Number(localStorage.getItem(LAST_KEY) || 0);
    $("status").textContent = (last ? `最終更新 ${dayLabel(last)}` : "まだ更新していません") + ` ・ 全${allArticles.length}件`;
  }
  const warn = $("warn");
  if (failedFeeds.length && !updating) {
    warn.textContent = `取得できなかった媒体: ${failedFeeds.join("、")}(通信が混み合っている可能性があります。少し待って「更新」をもう一度押してください)`;
    warn.classList.add("show");
  } else warn.classList.remove("show");

  /* 記事の絞り込み */
  const articles = allArticles.filter(a => {
    if (isRead(a) !== wantRead) return false;
    if (genreFilter !== "all" && a.genreClass !== genreFilter) return false;
    if (query && !`${a.title} ${a.description} ${a.source} ${a.genreName}`.toLowerCase().includes(query)) return false;
    return true;
  });

  const list = $("newsList");
  if (!articles.length) {
    let msg;
    if (!allArticles.length) msg = updating ? "⏳ ニュースを取得しています…<br>しばらくお待ちください" : "記事がありません。<br>右上の「更新」を押してください。";
    else if (query) msg = `「${escapeHtml($("searchInput").value.trim())}」に一致する記事はありません。`;
    else if (genreFilter !== "all") msg = `「${GENRE_NAME[genreFilter]}」の${wantRead ? "既読" : "未読"}記事はありません。<br>上の「すべて」を押すと、ほかのジャンルが見られます。`;
    else msg = wantRead ? "既読の記事はまだありません。" : "未読の記事は、ありません 🎉<br>「更新」で新着を確認できます。";
    list.innerHTML = `<div class="msg">${msg}</div>`;
    return;
  }

  list.innerHTML = articles.map(a => `
    <article class="card ${a.genreClass}" data-link="${escapeHtml(a.link)}">
      <div class="source">${escapeHtml(a.source)} / ${escapeHtml(a.genreName)}</div>
      <h2><a href="${escapeHtml(a.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(a.title)}</a></h2>
      <p>${escapeHtml(a.description)}</p>
      <div class="card-footer">
        <span>${escapeHtml(dayLabel(a.ts))}</span>
        <span class="card-buttons">${wantRead
          ? '<button class="btn restore" type="button" data-act="unread">未読に戻す</button><button class="btn open" type="button" data-act="open">開く</button>'
          : '<button class="btn read" type="button" data-act="read">開かずに既読</button>'}</span>
      </div>
    </article>`).join("");
}

/* ===== 操作 ===== */
function setRead(link, on) {
  on ? readSet.add(link) : readSet.delete(link);
  saveRead();
}
$("newsList").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const link = card.dataset.link;
  const btn = e.target.closest("button[data-act]");
  if (btn) {
    const act = btn.dataset.act;
    if (act === "read" || act === "unread") { setRead(link, act === "read"); render(); }
    else if (act === "open") window.open(link, "_blank", "noopener,noreferrer");
    return;
  }
  // 記事を開いたら既読にする(カードは、そのまま残して薄くするだけ)
  if (e.target.closest("a") && mode === "unread") {
    setRead(link, true);
    card.classList.add("done");
    const n = allArticles.filter(a => !isRead(a)).length;
    $("unreadN").textContent = n;
    $("readN").textContent = allArticles.length - n;
  }
});
$("newsList").addEventListener("auxclick", e => {     // マウスのホイールクリックで開いた場合
  const a = e.target.closest("a");
  const card = e.target.closest(".card");
  if (a && card && mode === "unread") { setRead(card.dataset.link, true); card.classList.add("done"); }
});
$("chips").addEventListener("click", e => {
  const b = e.target.closest("[data-genre]");
  if (!b) return;
  genreFilter = (genreFilter === b.dataset.genre) ? "all" : b.dataset.genre;
  render();
});
$("unreadBtn").onclick = () => { mode = "unread"; render(); };
$("readBtn").onclick   = () => { mode = "read"; render(); };
$("updateBtn").onclick = updateNews;
let searchTimer;
$("searchInput").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(render, 150); });

$("resetBtn").onclick = () => {
  const n = allArticles.filter(isRead).length;
  if (!n) { alert("既読の記事は、ありません。"); return; }
  if (confirm(`既読の${n}件を、すべて未読に戻しますか?(記事は消えません)`)) {
    readSet.clear(); saveRead(); mode = "unread"; render();
  }
};
$("purgeBtn").onclick = () => {
  const n = allArticles.filter(isRead).length;
  if (!n) { alert("既読の記事は、ありません。"); return; }
  if (confirm(`既読の${n}件を、一覧から削除しますか?`)) {
    allArticles = allArticles.filter(a => !isRead(a));
    readSet.clear(); saveRead(); saveArticles(); render();
  }
};

/* ===== 起動 ===== */
loadState();
render();
const last = Number(localStorage.getItem(LAST_KEY) || 0);
if (!allArticles.length || Date.now() - last > AUTO_UPDATE_MIN * 60000) updateNews();
</script>
</body>
</html>
